[project]
name = "mermaid-repair"
version = "0.1.1"
description = "Grammar-driven repair for LLM-generated Mermaid diagrams, verified against the real Mermaid parser."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DPS Productivity" }]
keywords = ["mermaid", "llm", "diagram", "sanitizer", "repair"]
dependencies = [
    "click>=8.1",
]

[project.scripts]
mermaid-repair = "mermaid_repair.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "mmdc: tests that require the Mermaid CLI (mmdc) to be installed",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
# Allow intentional broad Exception catches in the verify/subprocess boundary.
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermaid_repair"]
